events {
    worker_connections 4096;
}

http {
    # O Docker DNS resolve 'app-node' para os IPs de todas as 6 réplicas
    upstream backend_app {
        server app-node:8080 max_fails=0;
        keepalive 32;
    }

    server {
        listen 8080;

        # Repassa todas as chamadas (incluindo /health, /telemetria, /audit/*)
        location / {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_next_upstream error timeout http_502 http_503;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Timeouts para não derrubar requisições durante os picos
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}