name: aps-sistema

networks:
  default:
  aps-net:
    external: true

services:
  # 1. Banco de Dados PostgreSQL (Cota: 0.20 vCPU)
  postgres-dist:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iot
      POSTGRES_DB: telemetria
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot -d telemetria"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Inicializador do Esquema SQL
  db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: iot
    volumes:
      - ./init.sql:/init.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      sh -c '
      until psql -h postgres-dist -U iot -d telemetria -f /init.sql; do
        echo "Aguardando criação das tabelas no PostgreSQL..."
        sleep 1
      done
      echo "Tabelas criadas com sucesso!"
      '
    depends_on:
      postgres-dist:
        condition: service_healthy

  # 2. Redis In-Memory Queue (Cota: 0.05 vCPU)
  redis:
    image: redis:alpine
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # 3. Réplicas da Aplicação Go (6 instâncias x 0.05 vCPU = 0.30 vCPU)
  app-node:
    build:
      context: .
      dockerfile: Dockerfile.monolito
    environment:
      DATABASE_URL: postgres://iot:iot@postgres-dist:5432/telemetria?sslmode=disable
      REDIS_URL: redis:6379
      GOMAXPROCS: 2
    deploy:
      replicas: 6
      resources:
        limits:
          cpus: '0.05'
          memory: 64M
    depends_on:
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  # 4. Proxy Reverso Nginx (Cota: 0.05 vCPU) - Exposto na rede aps-net com o alias 'aps-app'
  aps-app:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 32M
    networks:
      default:
      aps-net:
        aliases:
          - aps-app
    depends_on:
      - app-node