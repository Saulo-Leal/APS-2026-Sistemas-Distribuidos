name: aps-sistema

networks:
  aps-net:
    external: true

services:
  # 1. Banco de Dados PostgreSQL (Cota ajustada: 0.20 CPU)
  postgres-dist:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iot
      POSTGRES_DB: telemetria
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot -d telemetria"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Inicializador do Esquema SQL
  db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: iot
    volumes:
      - ./init.sql:/init.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      for i in $$(seq 1 30); do
        psql -h postgres-dist -U iot -d telemetria -f /init.sql && exit 0
        sleep 1
      done
      exit 1
    depends_on:
      postgres-dist:
        condition: service_healthy

  # 2. Filas de Mensagens (RabbitMQ - Cota: 0.15 CPU)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 256M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 3. Réplicas de Aplicação API Ingestão (4 instâncias x 0.05 CPU)
  app-node:
    build:
      context: .
      dockerfile: Dockerfile.monolito
    environment:
      DATABASE_URL: postgres://iot:iot@postgres-dist:5432/telemetria?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      GOMAXPROCS: 2
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: '0.05'
          memory: 64M
    depends_on:
      rabbitmq:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  # 4. Proxy Reverso e Load Balancer (Nginx - Cota: 0.05 CPU)
  # Publica na rede aps-net sob o alias obrigatório 'aps-app' na porta 8080
  aps-app:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 32M
    networks:
      default:
      aps-net:
        aliases: [aps-app]
    depends_on:
      - app-node